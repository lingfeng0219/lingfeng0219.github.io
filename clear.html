<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Refreshing Portfolio</title>
    <style>
      body {
        align-items: center;
        background: #f6f3ef;
        color: #27221f;
        display: flex;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      main {
        max-width: 520px;
        padding: 32px;
        text-align: center;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 12px;
      }

      p {
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Refreshing portfolio cache</h1>
      <p>This page clears the old cached version, then opens the latest portfolio.</p>
    </main>
    <script>
      async function clearPortfolioCache() {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }

        window.location.replace('/?refresh=c6c73b9');
      }

      clearPortfolioCache().catch(() => {
        window.location.replace('/?refresh=c6c73b9');
      });
    </script>
  </body>
</html>
